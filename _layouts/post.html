---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
  </p>
  {{ content }}
  <p class="back"><a href="{{ '/notes/' | relative_url }}">← All notes</a></p>
</article>
